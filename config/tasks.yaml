# 内容创作工作流 Task 定义
# {变量} 在运行时由 Crew.kickoff(inputs=...) 注入

plan_task:
  description: >
    请根据以下创作需求，制定一份结构化的内容创作计划。


    【创作需求】
    内容类型：{content_type}
    核心需求：{user_prompt}
    目标受众：{audience}
    期望语气：{tone}
    长度要求：{length_hint}
    补充要求：{extra_requirements}
    模板提示：{template_hint}

    【可用工具】
    你可以使用以下工具来获取额外信息：

    📚 内部知识：
    - "历史案例检索"：搜索与当前需求相似的历史成功案例
    - "用户偏好记忆"：查询用户的创作偏好和历史行为模式
    - "知识库检索"：搜索知识库中的参考条目

    🌐 外部搜索：
    - "全网搜索"：在互联网上搜索最新资讯、评测、热点话题
    - "网页阅读"：读取指定 URL 的完整内容
    - "YouTube字幕"：提取 YouTube 视频字幕文本
    - "GitHub搜索"：搜索开源仓库和技术实现

    请在制定计划前主动使用这些工具来丰富你的判断依据。

    【输出要求】
    请严格输出以下 4 个部分：
    1. 任务理解 — 用一句话概括创作目标
    2. 目标受众与语气策略 — 分析受众特征并确定最佳表达策略
    3. 内容结构大纲 — 列出清晰的段落/章节结构，每部分标注核心要点
    4. 写作约束清单 — 列出必须遵守的约束（语气、长度、禁忌、格式要求等）

    不要写成品正文，不要解释你自己是谁。
  expected_output: "一份包含任务理解、受众策略、结构大纲、约束清单的结构化创作计划"
  agent: planner

write_task:
  description: >
    请根据创作计划，撰写完整的初稿。


    【创作需求】
    核心需求：{user_prompt}
    内容类型：{content_type}
    目标受众：{audience}
    期望语气：{tone}
    长度要求：{length_hint}
    补充要求：{extra_requirements}

    【创作计划】（来自 Planner）
    {plan_task}

    【写作要求】
    - 必须严格贴合创作计划中的大纲和约束
    - 结构完整，段落分明
    - 语言自然流畅，不要写成提示词回答风格
    - 直接输出内容成品，不要额外解释"这是初稿"之类
  expected_output: "一篇完整的内容初稿，直接是成品格式，无额外解释"
  agent: writer
  context: ["plan_task"]

critique_task:
  description: >
    请以严格编辑的标准，审查以下初稿。


    【原始需求】
    核心需求：{user_prompt}
    内容类型：{content_type}
    目标受众：{audience}
    期望语气：{tone}
    长度要求：{length_hint}
    补充要求：{extra_requirements}

    【初稿内容】（来自 Writer）
    {write_task}

    【评审要求】
    请从以下四个维度评分并给出具体意见：
    1. 需求符合度（1-10）— 是否精准回应了核心需求？
    2. 结构完整度（1-10）— 段落逻辑是否清晰完整？
    3. 文风统一性（1-10）— 语气是否一致？是否符合期望语气？
    4. 事实风险（1-10，分数越高风险越低）— 有无事实性错误或可疑表述？

    【输出格式】
    1. 总体判断
    2. 问题清单（逐条列出，标注严重程度）
    3. 修改建议（针对每条问题的具体改进方案）
    4. 四维度评分表
  expected_output: "一份包含总体判断、问题清单、修改建议、四维度评分的审稿报告"
  agent: critic
  context: ["write_task"]

edit_task:
  description: >
    请根据审稿意见，完成终稿改写。


    【原始需求】
    核心需求：{user_prompt}
    内容类型：{content_type}
    目标受众：{audience}
    期望语气：{tone}
    长度要求：{length_hint}
    补充要求：{extra_requirements}

    【初稿】（来自 Writer）
    {write_task}

    【审稿意见】（来自 Critic）
    {critique_task}

    【编辑要求】
    - 优先修正审稿意见中指出的实质问题
    - 保留初稿中仍然有效的精彩表达
    - 结构更清晰，语言更顺滑
    - 确保最终版本完全满足原始创作需求

    【重要】只输出最终成品，不输出任何解释、说明、标注。用户拿到的就应该是可以直接发布的内容。
  expected_output: "最终版内容成品，结构完整，语言顺滑，直接可用，无额外解释或标注"
  agent: editor
  context: ["write_task", "critique_task"]

evolution_task:
  description: |
    请分析以下反馈数据，生成系统进化建议。

    【系统当前状态】
    总运行次数：{total_runs}
    反馈总数：{feedback_count}
    平均评分：{avg_rating}/5
    高分案例数（≥4分）：{successful_count}
    用户偏好画像：{user_preferences}

    【近期反馈详情】
    {feedback_summary}

    【当前各 Agent 配置摘要】
    Planner: 负责需求拆解和创作计划制定
    Writer: 负责根据计划撰写初稿
    Critic: 负责从四个维度审稿评分
    Editor: 负责根据审稿意见完成终稿

    【输出要求】
    请严格输出以下 5 个部分，每项建议必须有数据支撑：

    1. 反馈趋势分析
       - 高分案例的共同特征
       - 低分案例的共同问题
       - 关键发现

    2. 提示词改进建议（针对 Planner/Writer/Critic/Editor）
       - 每个 Agent 的具体改进文本
       - 改进理由（引用案例）

    3. 工作流调整建议
       - 是否需要增加、删除或调整 Agent 顺序
       - 是否有新的质量检查环节值得引入

    4. 评分规则优化
       - Critic 的四个评分维度是否需要调整
       - 是否需要增加新的评分维度

    5. 模板优化建议
       - 现有模板的默认参数是否需要调整
       - 是否需要新增模板

    所有建议按优先级从高到低排序，确保可执行、可验证。
  expected_output: "一份包含趋势分析、提示词改进、工作流建议、评分优化、模板优化的完整进化报告"
  agent: evolution
